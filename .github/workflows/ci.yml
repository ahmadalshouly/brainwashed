name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: TypeScript (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the web chat
        run: pnpm --filter @brainwashed/web build

  rust:
    name: Rust (fmt + clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --all --check
      # The host crate embeds the built frontend, so it needs dist/ to exist.
      - run: mkdir -p apps/host/dist
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  model:
    name: Model training kit (Python tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml jinja2
      - working-directory: model
        run: python -m unittest discover -s tests -t . -v

  relay-image:
    name: Relay (Docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f crates/relay/Dockerfile -t brainwashed-relay .
      - name: Smoke test
        run: |
          docker run -d --rm -p 8080:8080 --name relay brainwashed-relay
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q brainwashed-relay
          docker stop relay

  llama-e2e:
    name: End to end with a real llama-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build llama-server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --target llama-server -j4
      - name: Make a tiny random-weight model
        run: |
          pip install gguf numpy
          python crates/runtime/tests/make_tiny_model.py "$RUNNER_TEMP/tiny.gguf"
      - run: mkdir -p apps/host/dist
      - name: Run tests against it
        env:
          BRAINWASHED_TEST_LLAMA_SERVER: ${{ runner.temp }}/llama.cpp/build/bin/llama-server
          BRAINWASHED_TEST_MODEL: ${{ runner.temp }}/tiny.gguf
        run: cargo test -p brainwashed-runtime -p brainwashed-core -p brainwashed-gateway
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Phone client against the real gateway
        env:
          BRAINWASHED_TEST_LLAMA_SERVER: ${{ runner.temp }}/llama.cpp/build/bin/llama-server
          BRAINWASHED_TEST_MODEL: ${{ runner.temp }}/tiny.gguf
        run: |
          cargo build -p brainwashed-gateway --example devserver
          BRAINWASHED_DEVSERVER="$PWD/target/debug/examples/devserver" pnpm --filter @brainwashed/api test

  cli:
    name: Command line (${{ matrix.platform }})
    needs: [js, rust]
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @brainwashed/web build
      - run: cargo build --release --locked -p brainwashed-cli
      - name: Smoke test
        shell: bash
        run: |
          target/release/brainwashed --version
          target/release/brainwashed models --data-dir "$RUNNER_TEMP/bw"
      - uses: actions/upload-artifact@v4
        with:
          name: brainwashed-cli-${{ matrix.platform }}
          path: |
            target/release/brainwashed
            target/release/brainwashed.exe
          if-no-files-found: error

  host:
    name: Host app (${{ matrix.platform }})
    needs: [js, rust]
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build installers
        run: pnpm --filter @brainwashed/host tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: brainwashed-host-${{ matrix.platform }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/rpm/*.rpm
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
