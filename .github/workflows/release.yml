name: Release

# Pushing a tag like v0.2.0 (or publishing a release on GitHub, which creates
# the tag) builds the `brainwashed` command for macOS (Apple silicon and
# Intel), Windows and Linux, attaches the archives to the release, and
# publishes the relay image to GitHub Container Registry. A tag with no
# release yet gets a draft release to review and publish. Running the
# workflow by hand builds everything without releasing, to check the pipeline.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/cli/Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version $version. Run scripts/set-version.mjs first."
            exit 1
          fi

  cli:
    name: Command line (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      # The binary embeds the web app it serves.
      - run: pnpm --filter @brainwashed/web build
      - run: cargo build --release --locked -p brainwashed-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$GITHUB_WORKSPACE/brainwashed-${{ matrix.target }}.zip" brainwashed.exe
          else
            tar -czf "$GITHUB_WORKSPACE/brainwashed-${{ matrix.target }}.tar.gz" brainwashed
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: brainwashed-${{ matrix.target }}.*
          if-no-files-found: error

  cli-release:
    name: Attach command-line builds
    if: github.ref_type == 'tag'
    needs: [check, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
      - name: Create a draft release if there's none yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            prerelease=""
            case "$VERSION" in 0.*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft $prerelease \
              --title "BrainWashed $VERSION" \
              --notes "Install or update with the one-line command in docs/install.md, or download the archive for your computer below."
          fi
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" brainwashed-* --clobber --repo "$GITHUB_REPOSITORY"

  relay-image:
    name: Relay image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/brainwashed-relay" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/relay/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.check.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
