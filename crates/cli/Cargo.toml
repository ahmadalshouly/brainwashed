[package]
name = "brainwashed-cli"
version = "0.3.6"
description = "The BrainWashed host: runs models, serves the web app with chat and admin pages, and makes this computer reachable from anywhere."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "brainwashed"
path = "src/main.rs"

[dependencies]
brainwashed-core = { path = "../core" }
brainwashed-gateway = { path = "../gateway" }
dirs = "7"
open = "5"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
