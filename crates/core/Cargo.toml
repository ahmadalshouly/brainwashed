[package]
name = "brainwashed-core"
version = "0.0.0"
description = "The BrainWashed engine: models, runtime, skills and chat."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
brainwashed-runtime = { path = "../runtime" }
brainwashed-skills = { path = "../skills" }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
